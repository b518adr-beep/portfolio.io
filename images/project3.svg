<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="p3Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#p3Bg)"/>
  
  <g transform="translate(60, 40)" filter="url(#p3Shadow)">
    <rect width="480" height="300" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Top Bar -->
    <rect width="480" height="36" rx="12" fill="#0F172A"/>
    <circle cx="25" cy="18" r="5" fill="#EF4444"/>
    <circle cx="42" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="59" cy="18" r="5" fill="#10B981"/>
    <rect x="90" y="8" width="300" height="20" rx="6" fill="#1E293B"/>
    <text x="240" y="22" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">hrms-enterprise.app/dashboard</text>

    <!-- Sidebar & Dashboard Grid -->
    <!-- Sidebar -->
    <rect x="400" y="45" width="70" height="245" rx="6" fill="#0F172A"/>
    <rect x="410" y="55" width="50" height="8" rx="4" fill="#6366F1"/>
    <rect x="410" y="75" width="50" height="6" rx="3" fill="#334155"/>
    <rect x="410" y="90" width="50" height="6" rx="3" fill="#334155"/>
    <rect x="410" y="105" width="50" height="6" rx="3" fill="#334155"/>
    <rect x="410" y="120" width="50" height="6" rx="3" fill="#334155"/>

    <!-- Top KPI Cards -->
    <rect x="15" y="45" width="115" height="60" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="120" y="65" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="end">إجمالي الكادر</text>
    <text x="120" y="88" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="end">284 موظف</text>

    <rect x="140" y="45" width="115" height="60" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="245" y="65" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="end">نسبة الحضور</text>
    <text x="245" y="88" fill="#10B981" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="end">98.4%</text>

    <rect x="265" y="45" width="125" height="60" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="380" y="65" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="end">طلبات الإجازة</text>
    <text x="380" y="88" fill="#F59E0B" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="end">12 قيد المراجعة</text>

    <!-- Main Chart Area -->
    <rect x="15" y="115" width="240" height="175" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="245" y="135" fill="#F8FAFC" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">مؤشرات الأداء السنوي</text>
    <!-- Bar charts -->
    <rect x="35" y="210" width="16" height="65" rx="3" fill="#6366F1"/>
    <rect x="65" y="180" width="16" height="95" rx="3" fill="#8B5CF6"/>
    <rect x="95" y="160" width="16" height="115" rx="3" fill="#6366F1"/>
    <rect x="125" y="190" width="16" height="85" rx="3" fill="#38BDF8"/>
    <rect x="155" y="150" width="16" height="125" rx="3" fill="#8B5CF6"/>
    <rect x="185" y="170" width="16" height="105" rx="3" fill="#6366F1"/>
    <rect x="215" y="140" width="16" height="135" rx="3" fill="#10B981"/>

    <!-- Table preview -->
    <rect x="265" y="115" width="125" height="175" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="380" y="135" fill="#F8FAFC" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">أحدث النشاطات</text>
    <rect x="275" y="150" width="105" height="25" rx="4" fill="#1E293B"/>
    <text x="370" y="166" fill="#94A3B8" font-family="sans-serif" font-size="8" text-anchor="end">تحديث مسير الرواتب</text>
