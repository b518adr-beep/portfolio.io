    <text x="370" y="201" fill="#94A3B8" font-family="sans-serif" font-size="8" text-anchor="end">اعتماد تقييم الربع الثالث</text>
    <rect x="275" y="220" width="105" height="25" rx="4" fill="#1E293B"/>
    <text x="370" y="236" fill="#94A3B8" font-family="sans-serif" font-size="8" text-anchor="end">إضافة موظف جديد</text>
    <rect x="275" y="255" width="105" height="25" rx="4" fill="#1E293B"/>
    <text x="370" y="271" fill="#94A3B8" font-family="sans-serif" font-size="8" text-anchor="end">تقارير التأمينات الاجتماعية</text>
