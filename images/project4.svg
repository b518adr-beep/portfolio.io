<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="p4Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#p4Bg)"/>
  
  <g transform="translate(60, 40)" filter="url(#p4Shadow)">
    <rect width="480" height="300" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Top Bar -->
    <rect width="480" height="36" rx="12" fill="#0F172A"/>
    <circle cx="25" cy="18" r="5" fill="#EF4444"/>
    <circle cx="42" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="59" cy="18" r="5" fill="#10B981"/>
    <rect x="90" y="8" width="300" height="20" rx="6" fill="#1E293B"/>
    <text x="240" y="22" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">landing-mastery.dev/growth</text>

    <!-- Content: Responsive Devices -->
    <!-- Desktop Screen center -->
    <g transform="translate(30, 55)">
      <!-- Main hero block -->
      <rect width="280" height="225" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <rect x="20" y="25" width="240" height="70" rx="6" fill="url(#p4Grad)"/>
      <text x="240" y="55" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">ضاعف مبيعاتك وأرباحك</text>
      <text x="240" y="75" fill="#FEF3C7" font-family="sans-serif" font-size="9" text-anchor="end">تصميم صفحات هبوط تركز على تجربة المستخدم ومعدل التحويل</text>

      <rect x="20" y="110" width="70" height="50" rx="4" fill="#1E293B"/>
      <text x="55" y="132" fill="#F59E0B" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+350%</text>
      <text x="55" y="148" fill="#94A3B8" font-family="sans-serif" font-size="7" text-anchor="middle">زيادة التحويل</text>

      <rect x="105" y="110" width="70" height="50" rx="4" fill="#1E293B"/>
      <text x="140" y="132" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">0.4s</text>
      <text x="140" y="148" fill="#94A3B8" font-family="sans-serif" font-size="7" text-anchor="middle">سرعة تحميل</text>

      <rect x="190" y="110" width="70" height="50" rx="4" fill="#1E293B"/>
      <text x="225" y="132" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100%</text>
      <text x="225" y="148" fill="#94A3B8" font-family="sans-serif" font-size="7" text-anchor="middle">SEO جاهز</text>

      <rect x="40" y="180" width="200" height="26" rx="13" fill="#F59E0B"/>
      <text x="140" y="197" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ابدأ حملتك التسويقية الآن</text>
    </g>

    <!-- Mobile Device overlapping on right -->
    <g transform="translate(330, 65)">
      <rect width="115" height="205" rx="14" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
      <rect x="40" y="6" width="35" height="4" rx="2" fill="#334155"/>
      <rect x="10" y="20" width="95" height="50" rx="6" fill="url(#p4Grad)"/>
      <text x="95" y="45" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="end">صفحة جوال سريعة</text>
      
      <rect x="10" y="80" width="95" height="30" rx="4" fill="#1E293B"/>
      <text x="57" y="98" fill="#38BDF8" font-family="sans-serif" font-size="8" text-anchor="middle">تصميم متجاوب بالكامل</text>

      <rect x="10" y="120" width="95" height="30" rx="4" fill="#1E293B"/>
      <text x="57" y="138" fill="#10B981" font-family="sans-serif" font-size="8" text-anchor="middle">متوافق مع سناب وإنستا</text>

      <rect x="15" y="165" width="85" height="22" rx="11" fill="#F59E0B"/>
      <text x="57" y="179" fill="#0F172A" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">اتصل الآن</text>
    </g>
  </g>
</svg>