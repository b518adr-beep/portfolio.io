<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="p1Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#p1Bg)"/>
  
  <!-- Subtle decorative grid -->
  <line x1="0" y1="95" x2="600" y2="95" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="0" y1="190" x2="600" y2="190" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="0" y1="285" x2="600" y2="285" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>
  
  <!-- Main Store Device / Browser Mockup -->
  <g transform="translate(60, 40)" filter="url(#p1Shadow)">
    <rect width="480" height="300" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Top Bar -->
    <rect width="480" height="36" rx="12" fill="#0F172A"/>
    <circle cx="25" cy="18" r="5" fill="#EF4444"/>
    <circle cx="42" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="59" cy="18" r="5" fill="#10B981"/>
    <!-- URL Bar -->
    <rect x="90" y="8" width="300" height="20" rx="6" fill="#1E293B"/>
    <text x="240" y="22" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">tech-elegance.store/smart-devices</text>
    
    <!-- Store Content -->
    <!-- Hero Banner inside Mockup -->
    <rect x="25" y="55" width="430" height="100" rx="8" fill="url(#p1Grad)"/>
    <text x="430" y="90" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="end">متجر التقنية والأناقة</text>
    <text x="430" y="112" fill="#E2E8F0" font-family="sans-serif" font-size="11" text-anchor="end">أحدث المنتجات الذكية والإلكترونيات الفاخرة</text>
    <rect x="350" y="125" width="80" height="20" rx="10" fill="#FFFFFF"/>
    <text x="390" y="139" fill="#0284C7" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">تسوق الآن</text>
    
    <!-- Product Cards Grid -->
    <!-- Card 1 -->
    <rect x="25" y="170" width="130" height="110" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="40" y="180" width="100" height="50" rx="4" fill="#1E293B"/>
    <circle cx="90" cy="205" r="16" fill="#38BDF8" fill-opacity="0.3"/>
    <text x="90" y="210" fill="#38BDF8" font-family="sans-serif" font-size="14" text-anchor="middle">⌚</text>
    <text x="90" y="248" fill="#F8FAFC" font-family="sans-serif" font-size="10" text-anchor="middle">ساعة ذكية Ultra</text>
    <text x="90" y="265" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">249 ر.س</text>

    <!-- Card 2 -->
    <rect x="175" y="170" width="130" height="110" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="190" y="180" width="100" height="50" rx="4" fill="#1E293B"/>
    <circle cx="240" cy="205" r="16" fill="#3B82F6" fill-opacity="0.3"/>
    <text x="240" y="210" fill="#38BDF8" font-family="sans-serif" font-size="14" text-anchor="middle">🎧</text>
    <text x="240" y="248" fill="#F8FAFC" font-family="sans-serif" font-size="10" text-anchor="middle">سماعات Pro عازلة</text>
    <text x="240" y="265" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">389 ر.س</text>

    <!-- Card 3 -->
    <rect x="325" y="170" width="130" height="110" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="340" y="180" width="100" height="50" rx="4" fill="#1E293B"/>
    <circle cx="390" cy="205" r="16" fill="#10B981" fill-opacity="0.3"/>
    <text x="390" y="210" fill="#38BDF8" font-family="sans-serif" font-size="14" text-anchor="middle">💻</text>
    <text x="390" y="248" fill="#F8FAFC" font-family="sans-serif" font-size="10" text-anchor="middle">منصة عمل ذكية</text>
    <text x="390" y="265" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">590 ر.س</text>
  </g>
</svg>