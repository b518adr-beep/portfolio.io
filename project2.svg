<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="p2Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#p2Bg)"/>
  
  <g transform="translate(60, 40)" filter="url(#p2Shadow)">
    <rect width="480" height="300" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Top Bar -->
    <rect width="480" height="36" rx="12" fill="#0F172A"/>
    <circle cx="25" cy="18" r="5" fill="#EF4444"/>
    <circle cx="42" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="59" cy="18" r="5" fill="#10B981"/>
    <rect x="90" y="8" width="300" height="20" rx="6" fill="#1E293B"/>
    <text x="240" y="22" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">marai-tayma.sa/fresh-meat</text>

    <!-- Header Banner -->
    <rect x="25" y="55" width="430" height="100" rx="8" fill="url(#p2Grad)"/>
    <text x="430" y="90" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="end">منصة مراعي تيماء</text>
    <text x="430" y="112" fill="#E2E8F0" font-family="sans-serif" font-size="11" text-anchor="end">أجود أنواع الذبائح البلدية الطازجة مع التوصيل المبرد السريع</text>
    <rect x="340" y="125" width="90" height="20" rx="10" fill="#FFFFFF"/>
    <text x="385" y="139" fill="#047857" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">اطلب ذبيحتك</text>

    <!-- Options and features -->
    <rect x="25" y="170" width="130" height="110" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="90" y="205" fill="#10B981" font-family="sans-serif" font-size="24" text-anchor="middle">🥩</text>
    <text x="90" y="235" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">خروف نعيمي بلدي</text>
    <text x="90" y="255" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">أوزان متنوعة وتجهيز</text>
    <text x="90" y="272" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1250 ر.س</text>

    <rect x="175" y="170" width="130" height="110" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="240" y="205" fill="#10B981" font-family="sans-serif" font-size="24" text-anchor="middle">🔪</text>
    <text x="240" y="235" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">خيارات التقطيع</text>
    <text x="240" y="255" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">مفطح، ثلاجة، أرباع</text>
    <text x="240" y="272" fill="#38BDF8" font-family="sans-serif" font-size="10" text-anchor="middle">تغليف هوائي مفرغ</text>

    <rect x="325" y="170" width="130" height="110" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="390" y="205" fill="#10B981" font-family="sans-serif" font-size="24" text-anchor="middle">🚚</text>
    <text x="390" y="235" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">توصيل بسيارات مبردة</text>
    <text x="390" y="255" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">خلال ساعتين من الذبح</text>
    <text x="390" y="272" fill="#10B981" font-family="sans-serif" font-size="10" text-anchor="middle">ضمان الجودة 100%</text>
  </g>
</svg>